# POC entrypoint #1 (simulates code-npm_node-build_snapshot.yml): a distinct
# top-level workflow that publishes through the SHARED reusable.
name: poc-oidc-entry-snapshot

on:
  push:
    branches: [test/oidc-claims-poc]

permissions:
  contents: read

jobs:
  publish-like:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/poc-oidc-claims-reusable.yml
    with:
      caller: snapshot-entrypoint
